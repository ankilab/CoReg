[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coreg"             # this is the *pip install name* (can be whatever)
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opencv-python",
    #"PyQt6",
    "pyqtgraph",
    "torch",
    "torchvision",
    "pillow",
    "imageio",
    "matplotlib",
    "scipy",
    "tifffile",
    "h5py",
    "hdf5plugin",
    "IPython",
    "imageio[pyav]",    
    "imageio[ffmpeg]",
    "pyflowreg",
    "jnormcorre",
    "antspyx"
    ]

[tool.setuptools]
package-dir = {"" = "src/CoReg"}
py-modules = ["gui", "cli"]        # include GUI and CLI top-level modules

[tool.setuptools.packages.find]
where = ["src/CoReg"]
include = ["cotracker*", "utils*"]

[project.scripts]
coreg-gui = "gui:main"
coreg-cli = "cli:main"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
